name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contract-scan-worker
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build Worker
        run: bun run build:worker
      - name: Install Wrangler
        run: npm install --global wrangler@4.167.0
      - name: Publish this commit
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          tag="${GITHUB_SHA:0:12}-$GITHUB_RUN_ATTEMPT"
          wrangler versions upload --tag "$tag" --message "$GITHUB_SHA"
          wrangler versions deploy --version-tag "$tag" --percentage 100 --yes --message "$GITHUB_SHA"
